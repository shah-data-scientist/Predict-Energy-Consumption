[project]
name = "predict-energy-consumption"
version = "0.1.0"
description = "OpenClassrooms Projet 3 - Predict Energy Consumption (Seattle Building Energy Benchmarking)"
authors = [
    {name = "Shahu"}
]
package-mode = false
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "scikit-learn (>=1.5.0,<1.6.0)",
    "catboost (>=1.2.8,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "seaborn (>=0.13.2,<1.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]
